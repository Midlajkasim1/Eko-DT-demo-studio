<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap');

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 24px;
            background: #0a1a1f;
            color: #f8fafc;
            font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            opacity: 0; /* Revealed once the session check finishes, to avoid a flash */
            transition: opacity 0.4s ease-out;
        }

        /* === HUD BACKGROUND (static) === */
        .hud-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            overflow: hidden;
            background: linear-gradient(to right,
                #041024 0%,   /* Very dark blue at far left */
                #0a3763 30%,  /* Vibrant blue center-left */
                #0b4d45 70%,  /* Transition mix */
                #043b22 100%  /* Emerald green at far right */
            );
        }

        /* Radial center glow */
        .hud-bg::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 800px; height: 800px;
            background: radial-gradient(circle,
                rgba(14, 165, 233, 0.15) 0%,
                rgba(16, 185, 129, 0.1) 40%,
                transparent 70%
            );
            pointer-events: none;
        }

        /* Glass Container */
        .login-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            padding: 48px 40px;
            background: rgba(2, 17, 43, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-top: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4),
                        0 0 30px rgba(90, 154, 150, 0.05),
                        inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(32px) saturate(160%) brightness(1.05);
            -webkit-backdrop-filter: blur(32px) saturate(160%) brightness(1.05);
            z-index: 10;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .login-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            margin-bottom: 32px;
        }

        .brand-icon {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-icon svg {
            height: 100%;
            width: auto;
            max-width: 240px;
            fill: #ffffff;
            object-fit: contain;
        }

        .site-name {
            font-family: 'Sora', 'DM Sans', system-ui, sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #38bdf8;
            letter-spacing: 0.3px;
        }

        .site-name:empty { display: none; }

        /* Form Elements */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #cbd5e1;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .label-optional {
            color: #64748b;
            font-weight: 400;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: #64748b;
            width: 16px;
            height: 16px;
            transition: color 0.25s;
            pointer-events: none;
        }

        input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #f8fafc;
            font-family: 'DM Sans', system-ui, sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
            box-sizing: border-box;
        }

        input::placeholder {
            color: #475569;
        }

        input:focus {
            background: rgba(15, 23, 42, 0.8);
            border-color: #0ea5e9;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2);
        }

        input:focus + .input-icon,
        input:not(:placeholder-shown) + .input-icon {
            color: #0ea5e9;
        }

        /* Button */
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #ffffff;
            font-family: 'DM Sans', system-ui, sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: background 0.25s ease, box-shadow 0.25s ease;
            position: relative;
            overflow: hidden;
            margin-top: 12px;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button:hover:not(:disabled) {
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.5);
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
        }

        button:disabled {
            opacity: 0.7;
            cursor: default;
        }

        /* Message Area */
        #message {
            margin-top: 20px;
            min-height: 20px;
            text-align: center;
            font-size: 13px;
            color: #ef4444;
            font-weight: 500;
            line-height: 1.4;
            opacity: 0;
            transition: opacity 0.25s;
        }

        .success {
            color: #10b981 !important;
        }

        @media (max-width: 540px) {
            body { padding: 16px; }
            .login-container { padding: 36px 24px; border-radius: 20px; }
        }
    </style>
</head>
<body>

    <!-- Gradient background with radial center glow -->
    <div class="hud-bg"></div>

    <div class="login-container">

        <div class="login-header">
            <div class="brand-icon">
                <svg width="100%" height="100%" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
                    viewBox="0 0 948.6 499.7" xml:space="preserve">
                    <g>
                        <g>
                            <g>
                                <path fill="#FFFFFF" d="M66.8,310.5h285.4c1.3-8.3,2-15.5,2-24.2c0-85.4-68.2-154.6-152.3-154.6S49.6,201,49.6,286.4
                                    S117.8,441,201.9,441c44.7,0,85-19.6,112.8-50.8l-38.4-36.1c-18.3,20.7-44.8,33.7-74.3,33.7c-55.1,0-99.8-45.4-99.8-101.4
                                    S146.9,185,202,185c47.1,0,86.6,33.1,97.1,77.7H94.5L66.8,310.5z"/>
                                <g>
                                    <path fill="#FFFFFF" d="M375,32.5h62.3v221.9l112.6-114.2h76.5L518.2,244l118.6,178.7h-76l-86.4-137.2l-37.2,36.1v101.1h-62.3V32.5
                                        H375z"/>
                                </g>
                            </g>
                            <path fill="#FFFFFF" d="M889,219.3c-6.6-17.2-16.3-32-28.9-44.5c-12.7-12.4-28.2-22.1-46.5-29.2c-18.4-7.1-39.2-10.6-62.7-10.6
                                s-44.4,3.5-62.7,10.6c-18.4,7.1-74.8,40.9-87.4,53.3l-63.6,45.6l68.6,88.8c14.5,18.8,23.2,31.3,35.9,43.7s28.2,22.2,46.5,29.2
                                c18.3,7.1,39.2,10.6,62.7,10.6c23.4,0,44.3-3.5,62.7-10.6s33.8-16.8,46.5-29.2c12.6-12.4,22.3-27.2,28.9-44.5
                                c6.6-17.2,10-36.2,10-56.9C899,255.4,895.6,236.6,889,219.3z M829.5,310.1c-3.2,11.2-8.2,21.3-15,30.3s-15.5,16.2-26.1,21.7
                                s-23.1,8.3-37.4,8.3c-14.4,0-26.9-2.8-37.5-8.3s-19.3-12.8-26.1-21.7c-6.8-9-11.8-19.1-15-30.3c-3.2-11.2-4.8-22.7-4.8-34.4
                                c0-11.4,1.6-22.8,4.8-34.1c3.2-11.4,8.2-21.5,15-30.3s15.5-15.9,26.1-21.5c10.6-5.5,23.1-8.3,37.5-8.3c14.3,0,26.8,2.8,37.4,8.3
                                c10.6,5.5,19.3,12.7,26.1,21.5s11.8,18.9,15,30.3s4.8,22.8,4.8,34.1C834.3,287.5,832.7,298.9,829.5,310.1z"/>
                        </g>
                    </g>
                </svg>
            </div>
            <div class="site-name" id="siteName"></div>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="server">Endpoint URL</label>
                <div class="input-wrapper">
                    <input type="text" id="server" value="https://localhost" placeholder="https://localhost" required>
                    <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
                </div>
            </div>

            <div class="form-group">
                <label for="username">Operator ID</label>
                <div class="input-wrapper">
                    <input type="text" id="username" placeholder="Enter your ID" autocomplete="username" required autofocus>
                    <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Authentication Key</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="Enter your key" autocomplete="current-password" required>
                    <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
            </div>

            <!-- <div class="form-group">
                <label for="project">Project Scope <span class="label-optional">— optional</span></label>
                <div class="input-wrapper">
                    <input type="text" id="project" placeholder="Leave blank for server default">
                    <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                </div>
            </div> -->

            <button type="submit" id="submitBtn">
                <span id="btnText">Secure Connect</span>
            </button>
        </form>

        <div id="message"></div>
    </div>

    <script>
    (function () {
        'use strict';

        var form = document.getElementById('loginForm');
        var message = document.getElementById('message');
        var btn = document.getElementById('submitBtn');
        var btnText = document.getElementById('btnText');
        var siteName = document.getElementById('siteName');
        var serverInput = document.getElementById('server');
        var projectInput = document.getElementById('project');

        function showMessage(text, isSuccess) {
            message.textContent = text;
            message.className = isSuccess ? 'success' : '';
            message.style.opacity = text ? '1' : '0';
        }

        function setBusy(busy, label) {
            btn.disabled = busy;
            btnText.textContent = label;
        }

        function resetButton() {
            setBusy(false, 'Secure Connect');
        }

        function reveal() {
            document.body.style.opacity = '1';
        }

        function openViewer() {
            window.location.replace('/');
        }

        // Current routes first, legacy second, so the page also works against a
        // server that has not been restarted with the newer route names.
        var STATUS_URLS = ['/api/auth/status', '/api/fin/status'];
        var LOGIN_URLS = ['/api/auth/login', '/api/fin/login'];
        // Who THIS browser is signed in as. The status says only that the backend is connected to
        // FIN, which another browser's sign-in also makes true: it never skips this form.
        var ME_URLS = ['/api/auth/me', '/api/fin/me'];

        // Walks the candidate URLs and returns the first response that is not a 404.
        async function request(urls, options) {
            var lastErr = null;
            for (var i = 0; i < urls.length; i++) {
                try {
                    var res = await fetch(urls[i], options);
                    if (res.status !== 404) return res;
                } catch (err) {
                    lastErr = err;
                }
            }
            if (lastErr) throw lastErr;
            return null; // every candidate answered 404
        }

        // Skip the form entirely when THIS browser already has a session.
        async function loadSession() {
            try {
                var res = await request(STATUS_URLS, { cache: 'no-store' });
                if (!res || !res.ok) { reveal(); return; }

                var data = await res.json();
                var project = data.project || data.project_name;
                var me = await request(ME_URLS, { cache: 'no-store', credentials: 'same-origin' });
                var active = !!(me && me.ok);
                if (me && !me.ok && me.status !== 401) {
                    showMessage('Your sign-in could not be checked (server error). Sign in again or reload.', false);
                }

                if (siteName && data.display_name) siteName.textContent = data.display_name;
                if (serverInput && data.server_url) serverInput.value = data.server_url;
                if (projectInput && project) projectInput.placeholder = project + ' (server default)';

                if (active) {
                    setBusy(true, 'Session Active');
                    openViewer();
                    return;
                }
                reveal();
            } catch (err) {
                // Server unreachable — show the form and let submit report the failure.
                console.warn('Session check failed:', err);
                reveal();
            }
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            showMessage('', false);
            setBusy(true, 'Authenticating...');

            var payload = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                server_url: serverInput.value.trim().replace(/\/+$/, '')
            };
            // Optional field — may be absent from the markup.
            var project = projectInput ? projectInput.value.trim() : '';
            if (project) payload.project_name = project;

            try {
                var res = await request(LOGIN_URLS, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!res) {
                    showMessage('Login endpoint not found. Restart the server and try again.', false);
                    resetButton();
                    return;
                }

                var data = await res.json().catch(function () { return {}; });

                if (res.ok && data.status === 'success') {
                    showMessage('Authentication successful', true);
                    setBusy(true, 'Authenticated');
                    openViewer();
                    return;
                }

                showMessage('Access Denied: ' + (data.detail || data.message || 'Invalid Credentials'), false);
                resetButton();
            } catch (err) {
                showMessage('Connection Error: Server Unreachable', false);
                resetButton();
                console.error(err);
            }
        });

        loadSession();
    })();
    </script>

</body>
</html>
